version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: health_analyzer_db
    restart: always
    environment:
      POSTGRES_USER: health_analyzer_user
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: health_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health_analyzer_backend
    restart: always
    environment:
      - SECRET_KEY=prod-secret-key-health-analyzer-2026-secure-token
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - DB_HOST=db
      - DB_USER=health_analyzer_user
      - DB_PASS=admin
      - DB_NAME=health_analyzer
      - DB_PORT=5432
      - DATABASE_URL=postgresql+psycopg://health_analyzer_user:admin@db:5432/health_analyzer
      - CORS_ALLOW_ORIGINS=http://localhost,http://localhost:5173,http://localhost:5174
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: health_analyzer_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
